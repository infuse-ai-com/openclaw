name: Infuse canary build

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Manual canary operation
        required: true
        default: build
        type: choice
        options:
          - build
          - phase5
      build_ref:
        description: Exact build/canary-openclaw-vYYYY.M.D[-rN] branch containing the reviewed controller
        required: false
        type: string
      build_sha:
        description: Exact 40-character commit at the head of build_ref
        required: false
        type: string
      qualification_ref:
        description: Exact qualify/canary-openclaw-vYYYY.M.D-rN branch containing the reviewed Phase 5 controller
        required: false
        type: string
      qualification_sha:
        description: Exact 40-character commit at the head of qualification_ref
        required: false
        type: string

run-name: Infuse canary ${{ inputs.operation }} ${{ inputs.build_ref }}${{ inputs.qualification_ref }} @ ${{ inputs.build_sha }}${{ inputs.qualification_sha }}

permissions:
  actions: read
  contents: read

concurrency:
  group: infuse-canary-${{ inputs.operation }}-${{ inputs.build_sha }}-${{ inputs.qualification_sha }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.operation == 'build' && github.repository == 'infuse-ai-com/openclaw' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 720
    env:
      INFUSE_CANARY_BUILD_REF: ${{ inputs.build_ref }}
      INFUSE_CANARY_BUILD_SHA: ${{ inputs.build_sha }}
    steps:
      - name: Checkout trusted dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve exact reviewed controller and candidate
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          branch_pattern='^build/canary-openclaw-v20[0-9]{2}\.(0?[1-9]|1[0-2])\.(0?[1-9]|[12][0-9]|3[01])(-r([2-9]|[1-9][0-9]+))?$'
          if [[ ! "$INFUSE_CANARY_BUILD_REF" =~ $branch_pattern ]]; then
            echo "build_ref must be a versioned controller branch, optionally with an immutable -rN attempt (N >= 2)" >&2
            exit 1
          fi
          if [[ ! "$INFUSE_CANARY_BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "build_sha must be a lowercase 40-character commit SHA" >&2
            exit 1
          fi

          controller_dir="$RUNNER_TEMP/infuse-canary-controller"
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${INFUSE_CANARY_BUILD_REF}:refs/remotes/origin/${INFUSE_CANARY_BUILD_REF}"
          resolved_build_sha="$(git rev-parse "refs/remotes/origin/${INFUSE_CANARY_BUILD_REF}^{commit}")"
          if [[ "$resolved_build_sha" != "$INFUSE_CANARY_BUILD_SHA" ]]; then
            echo "build_ref head does not match build_sha" >&2
            exit 1
          fi
          git worktree add --detach "$controller_dir" "$resolved_build_sha"

          binding="$controller_dir/ci/infuse-canary/binding.json"
          controller="$controller_dir/ci/infuse-canary/run-host.py"
          test -f "$binding"
          test -f "$controller"

          mapfile -t candidate < <(
            /usr/bin/python3 -I - "$binding" "$INFUSE_CANARY_BUILD_REF" <<'PY'
          import json
          import pathlib
          import re
          import sys

          binding_path = pathlib.Path(sys.argv[1])
          build_ref = sys.argv[2]
          value = json.loads(binding_path.read_text(encoding="utf-8"))
          if value.get("schemaVersion") != 3:
              raise SystemExit("unsupported Infuse canary binding schema")
          if value.get("repository") != "infuse-ai-com/openclaw":
              raise SystemExit("binding repository mismatch")
          if value.get("bootstrapBranch") != build_ref:
              raise SystemExit("binding bootstrap branch mismatch")
          if value.get("runnerLabel") != "blacksmith-16vcpu-ubuntu-2404":
              raise SystemExit("binding must select the approved 16-vCPU/64-GB Blacksmith runner")

          build_match = re.fullmatch(
              r"build/canary-openclaw-v(20[0-9]{2}\.(?:0?[1-9]|1[0-2])\.(?:0?[1-9]|[12][0-9]|3[01]))(?:-r([2-9]|[1-9][0-9]+))?",
              build_ref,
          )
          if build_match is None:
              raise SystemExit("build branch is invalid")
          build_attempt = int(build_match.group(2) or "1")
          if value.get("buildAttempt") != build_attempt:
              raise SystemExit("binding build attempt mismatch")

          candidate_branch = value.get("candidateBranch")
          candidate_commit = value.get("candidateCommit")
          base_commit = value.get("baseCommit")
          branch_match = re.fullmatch(
              r"canary-openclaw-v(20[0-9]{2}\.(?:0?[1-9]|1[0-2])\.(?:0?[1-9]|[12][0-9]|3[01]))",
              candidate_branch if isinstance(candidate_branch, str) else "",
          )
          if branch_match is None:
              raise SystemExit("binding candidate branch is invalid")
          if not isinstance(candidate_commit, str) or re.fullmatch(r"[0-9a-f]{40}", candidate_commit) is None:
              raise SystemExit("binding candidate commit is invalid")
          if not isinstance(base_commit, str) or re.fullmatch(r"[0-9a-f]{40}", base_commit) is None:
              raise SystemExit("binding base commit is invalid")
          if build_match.group(1) != branch_match.group(1):
              raise SystemExit("build and candidate versions differ")

          print(candidate_branch)
          print(candidate_commit)
          print(base_commit)
          PY
          )
          if (( ${#candidate[@]} != 3 )); then
            echo "candidate binding did not produce an exact branch, candidate commit, and base commit" >&2
            exit 1
          fi
          candidate_ref="${candidate[0]}"
          candidate_sha="${candidate[1]}"
          base_sha="${candidate[2]}"

          # The controller bind-mounts the candidate into a secretless container,
          # so it needs a self-contained .git directory rather than a linked
          # worktree whose administration directory lives outside that mount.
          candidate_dir="$RUNNER_TEMP/infuse-canary-candidate"
          git clone --no-tags --no-checkout --depth=256 --single-branch \
            --branch "$candidate_ref" \
            https://github.com/infuse-ai-com/openclaw.git \
            "$candidate_dir"
          resolved_candidate_sha="$(git -C "$candidate_dir" rev-parse "refs/remotes/origin/${candidate_ref}^{commit}")"
          if [[ "$resolved_candidate_sha" != "$candidate_sha" ]]; then
            echo "candidate branch head does not match its reviewed binding" >&2
            exit 1
          fi
          if ! git -C "$candidate_dir" cat-file -e "${base_sha}^{commit}" || \
            [[ "$(git -C "$candidate_dir" merge-base "$base_sha" "$resolved_candidate_sha")" != "$base_sha" ]]; then
            echo "candidate history does not contain its reviewed upstream base within 256 commits" >&2
            exit 1
          fi
          git -C "$candidate_dir" checkout --detach "$resolved_candidate_sha"

          {
            echo "controller=$controller"
            echo "candidate_dir=$candidate_dir"
            echo "candidate_sha=$resolved_candidate_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Build and qualify exact candidate
        env:
          INFUSE_CANARY_DISPATCH_REF: ${{ inputs.build_ref }}
          INFUSE_CANARY_DISPATCH_SHA: ${{ inputs.build_sha }}
          INFUSE_CANARY_CANDIDATE_SHA: ${{ steps.resolve.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I "${{ steps.resolve.outputs.controller }}" \
            --source "${{ steps.resolve.outputs.candidate_dir }}"

      - name: Retain temporary sanitized build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infuse-canary-${{ inputs.build_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: canary-artifacts/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  phase5:
    if: inputs.operation == 'phase5' && github.repository == 'infuse-ai-com/openclaw' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 720
    env:
      INFUSE_CANARY_QUALIFICATION_REF: ${{ inputs.qualification_ref }}
      INFUSE_CANARY_QUALIFICATION_SHA: ${{ inputs.qualification_sha }}
    steps:
      - name: Checkout trusted dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve exact qualification controller
        id: resolve-phase5
        shell: bash
        run: |
          set -euo pipefail

          branch_pattern='^qualify/canary-openclaw-v20[0-9]{2}\.(0?[1-9]|1[0-2])\.(0?[1-9]|[12][0-9]|3[01])-r([1-9]|[1-9][0-9]+)$'
          if [[ ! "$INFUSE_CANARY_QUALIFICATION_REF" =~ $branch_pattern ]]; then
            echo "qualification_ref must be a versioned immutable qualification controller branch" >&2
            exit 1
          fi
          if [[ ! "$INFUSE_CANARY_QUALIFICATION_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "qualification_sha must be a lowercase 40-character commit SHA" >&2
            exit 1
          fi

          controller_dir="$RUNNER_TEMP/infuse-canary-phase5-controller"
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${INFUSE_CANARY_QUALIFICATION_REF}:refs/remotes/origin/${INFUSE_CANARY_QUALIFICATION_REF}"
          resolved_sha="$(git rev-parse "refs/remotes/origin/${INFUSE_CANARY_QUALIFICATION_REF}^{commit}")"
          if [[ "$resolved_sha" != "$INFUSE_CANARY_QUALIFICATION_SHA" ]]; then
            echo "qualification_ref head does not match qualification_sha" >&2
            exit 1
          fi
          git worktree add --detach "$controller_dir" "$resolved_sha"

          version="${INFUSE_CANARY_QUALIFICATION_REF#qualify/canary-openclaw-v}"
          version="${version%-r*}"
          qualification_attempt="${INFUSE_CANARY_QUALIFICATION_REF##*-r}"
          controller_root="$controller_dir/ci/infuse-canary/phase5-v${version}"
          execution="$controller_root/execution.json"
          runner="$controller_root/run-phase5.py"
          test -f "$execution"
          test -f "$runner"

          mapfile -t binding < <(
            /usr/bin/python3 -I - "$execution" "$version" "$qualification_attempt" <<'PY'
          import json
          import pathlib
          import re
          import sys

          execution = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          version = sys.argv[2]
          qualification_attempt = int(sys.argv[3])
          if execution.get("schema") != 1:
              raise SystemExit("unsupported Phase 5 execution schema")
          if execution.get("qualificationAttempt") != qualification_attempt:
              raise SystemExit("Phase 5 qualification attempt mismatch")
          if execution.get("repository") != "infuse-ai-com/openclaw":
              raise SystemExit("Phase 5 repository mismatch")
          if execution.get("runnerLabel") != "blacksmith-8vcpu-ubuntu-2404":
              raise SystemExit("Phase 5 must select the approved 8-vCPU/32-GB Blacksmith runner")
          if execution.get("candidateId") != f"v{version}-infuse-{execution.get('sourceCommit', '')[:10]}":
              raise SystemExit("Phase 5 candidate identity mismatch")
          if re.fullmatch(r"[0-9a-f]{40}", execution.get("sourceCommit", "")) is None:
              raise SystemExit("Phase 5 source commit is invalid")
          hosted = execution.get("hostedArtifact")
          if not isinstance(hosted, dict) or hosted.get("runAttempt") != 1:
              raise SystemExit("Phase 5 hosted artifact binding is invalid")
          if not isinstance(hosted.get("runId"), int) or hosted["runId"] <= 0:
              raise SystemExit("Phase 5 hosted run ID is invalid")
          if not isinstance(hosted.get("artifactId"), int) or hosted["artifactId"] <= 0:
              raise SystemExit("Phase 5 hosted artifact ID is invalid")
          if not isinstance(hosted.get("name"), str) or not hosted["name"]:
              raise SystemExit("Phase 5 hosted artifact name is invalid")
          print(hosted["runId"])
          print(hosted["artifactId"])
          print(hosted["name"])
          PY
          )
          if (( ${#binding[@]} != 3 )); then
            echo "qualification binding did not produce an exact run, artifact ID, and artifact name" >&2
            exit 1
          fi
          {
            echo "controller_root=$controller_root"
            echo "runner=$runner"
            echo "run_id=${binding[0]}"
            echo "artifact_id=${binding[1]}"
            echo "artifact_name=${binding[2]}"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact hosted package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: infuse-ai-com/openclaw
          run-id: ${{ steps.resolve-phase5.outputs.run_id }}
          name: ${{ steps.resolve-phase5.outputs.artifact_name }}
          path: ${{ runner.temp }}/infuse-canary-hosted-artifact

      - name: Verify downloaded artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.resolve-phase5.outputs.artifact_id }}
          EXPECTED_ARTIFACT_NAME: ${{ steps.resolve-phase5.outputs.artifact_name }}
          EXPECTED_RUN_ID: ${{ steps.resolve-phase5.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}")"
          actual_name="$(jq -r '.name' <<<"$metadata")"
          actual_run="$(jq -r '.workflow_run.id' <<<"$metadata")"
          expired="$(jq -r '.expired' <<<"$metadata")"
          if [[ "$actual_name" != "$EXPECTED_ARTIFACT_NAME" || "$actual_run" != "$EXPECTED_RUN_ID" || "$expired" != "false" ]]; then
            echo "downloaded hosted artifact identity differs from the reviewed binding" >&2
            exit 1
          fi

      - name: Execute exact Phase 5 lanes
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I "${{ steps.resolve-phase5.outputs.runner }}" \
            --artifact-root "$RUNNER_TEMP/infuse-canary-hosted-artifact" \
            --controller-sha "$INFUSE_CANARY_QUALIFICATION_SHA" \
            --output "$RUNNER_TEMP/phase5-output"

      - name: Retain temporary sanitized Phase 5 evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infuse-canary-phase5-${{ inputs.qualification_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase5-output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true
