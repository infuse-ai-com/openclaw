name: Infuse canary build

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Exact build/canary-openclaw-vYYYY.M.D branch containing the reviewed controller
        required: true
        type: string
      build_sha:
        description: Exact 40-character commit at the head of build_ref
        required: true
        type: string

run-name: Infuse canary ${{ inputs.build_ref }} @ ${{ inputs.build_sha }}

permissions:
  contents: read

concurrency:
  group: infuse-canary-${{ inputs.build_sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'infuse-ai-com/openclaw' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 720
    env:
      INFUSE_CANARY_BUILD_REF: ${{ inputs.build_ref }}
      INFUSE_CANARY_BUILD_SHA: ${{ inputs.build_sha }}
    steps:
      - name: Checkout trusted dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve exact reviewed controller and candidate
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          branch_pattern='^build/canary-openclaw-v20[0-9]{2}\.(0?[1-9]|1[0-2])\.(0?[1-9]|[12][0-9]|3[01])$'
          if [[ ! "$INFUSE_CANARY_BUILD_REF" =~ $branch_pattern ]]; then
            echo "build_ref must match an upstream numeric version such as build/canary-openclaw-v2026.11.3" >&2
            exit 1
          fi
          if [[ ! "$INFUSE_CANARY_BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "build_sha must be a lowercase 40-character commit SHA" >&2
            exit 1
          fi

          controller_dir="$RUNNER_TEMP/infuse-canary-controller"
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${INFUSE_CANARY_BUILD_REF}:refs/remotes/origin/${INFUSE_CANARY_BUILD_REF}"
          resolved_build_sha="$(git rev-parse "refs/remotes/origin/${INFUSE_CANARY_BUILD_REF}^{commit}")"
          if [[ "$resolved_build_sha" != "$INFUSE_CANARY_BUILD_SHA" ]]; then
            echo "build_ref head does not match build_sha" >&2
            exit 1
          fi
          git worktree add --detach "$controller_dir" "$resolved_build_sha"

          binding="$controller_dir/ci/infuse-canary/binding.json"
          controller="$controller_dir/ci/infuse-canary/run-host.py"
          test -f "$binding"
          test -f "$controller"

          mapfile -t candidate < <(
            /usr/bin/python3 -I - "$binding" "$INFUSE_CANARY_BUILD_REF" <<'PY'
          import json
          import pathlib
          import re
          import sys

          binding_path = pathlib.Path(sys.argv[1])
          build_ref = sys.argv[2]
          value = json.loads(binding_path.read_text(encoding="utf-8"))
          if value.get("schemaVersion") != 3:
              raise SystemExit("unsupported Infuse canary binding schema")
          if value.get("repository") != "infuse-ai-com/openclaw":
              raise SystemExit("binding repository mismatch")
          if value.get("bootstrapBranch") != build_ref:
              raise SystemExit("binding bootstrap branch mismatch")
          if value.get("runnerLabel") != "blacksmith-8vcpu-ubuntu-2404":
              raise SystemExit("binding must select the approved 8-vCPU/32-GB Blacksmith runner")

          candidate_branch = value.get("candidateBranch")
          candidate_commit = value.get("candidateCommit")
          branch_match = re.fullmatch(
              r"canary-openclaw-v(20[0-9]{2}\.(?:0?[1-9]|1[0-2])\.(?:0?[1-9]|[12][0-9]|3[01]))",
              candidate_branch if isinstance(candidate_branch, str) else "",
          )
          if branch_match is None:
              raise SystemExit("binding candidate branch is invalid")
          if not isinstance(candidate_commit, str) or re.fullmatch(r"[0-9a-f]{40}", candidate_commit) is None:
              raise SystemExit("binding candidate commit is invalid")
          if build_ref.removeprefix("build/canary-openclaw-v") != branch_match.group(1):
              raise SystemExit("build and candidate versions differ")

          print(candidate_branch)
          print(candidate_commit)
          PY
          )
          if (( ${#candidate[@]} != 2 )); then
            echo "candidate binding did not produce an exact branch and commit" >&2
            exit 1
          fi
          candidate_ref="${candidate[0]}"
          candidate_sha="${candidate[1]}"

          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${candidate_ref}:refs/remotes/origin/${candidate_ref}"
          resolved_candidate_sha="$(git rev-parse "refs/remotes/origin/${candidate_ref}^{commit}")"
          if [[ "$resolved_candidate_sha" != "$candidate_sha" ]]; then
            echo "candidate branch head does not match its reviewed binding" >&2
            exit 1
          fi
          candidate_dir="$RUNNER_TEMP/infuse-canary-candidate"
          git worktree add --detach "$candidate_dir" "$resolved_candidate_sha"

          {
            echo "controller=$controller"
            echo "candidate_dir=$candidate_dir"
            echo "candidate_sha=$resolved_candidate_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Build and qualify exact candidate
        env:
          INFUSE_CANARY_DISPATCH_REF: ${{ inputs.build_ref }}
          INFUSE_CANARY_DISPATCH_SHA: ${{ inputs.build_sha }}
          INFUSE_CANARY_CANDIDATE_SHA: ${{ steps.resolve.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I "${{ steps.resolve.outputs.controller }}" \
            --source "${{ steps.resolve.outputs.candidate_dir }}"

      - name: Retain temporary sanitized build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infuse-canary-${{ inputs.build_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: canary-artifacts/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
